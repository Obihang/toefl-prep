name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Block truncated code (comments cut short with ellipsis)
        run: ! grep -rnE "//\s*\.\.\.\s*(existing|rest of|remaining)" src/ api/

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Simulations
        run: npm run test:sim

